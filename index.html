<style>
:root{
  --ink:#17150f; --cream:#f7f2e8; --paper:#fffdf7; --acc:#f4b62a; --acc-d:#d99a0f;
  --muted:#645f53; --line:rgba(23,21,15,.14);
  --r:26px;
  --font:'Sora',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
.wrap{width:100%;max-width:1120px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:8px}

/* header */
.hd{position:sticky;top:0;z-index:20;background:rgba(247,242,232,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hd .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;height:68px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-size:23px;letter-spacing:-.8px;line-height:1}
.brand img{width:34px;height:34px}
.brand b,.brand span{font-weight:800}.brand{letter-spacing:-.06em}
.nav{display:flex;align-items:center;gap:6px}
.nav a{text-decoration:none;padding:10px 14px;border-radius:999px;font-weight:500;font-size:16px}
.nav a:hover{background:rgba(23,21,15,.07)}
.nav a.pill{background:var(--ink);color:var(--cream)}
.nav a.pill:hover{background:#34301f}

/* hero */
.hero{padding:72px 0 48px}
.eyebrow{display:inline-block;padding:7px 16px;border-radius:999px;background:var(--acc);font-weight:800;font-size:14px;letter-spacing:.04em;margin-bottom:22px}
.hero h1{margin:0;font-size:clamp(36px,7vw,76px);line-height:1.02;letter-spacing:-.05em;font-weight:800;max-width:15ch;text-wrap:balance}
.hero h1 em{font-style:normal;background:linear-gradient(transparent 62%,var(--acc) 62%)}
.hero p{margin:24px 0 0;max-width:34em;font-size:clamp(18px,2.4vw,22px);color:var(--muted)}
.hero .row{display:flex;gap:12px;flex-wrap:wrap;margin-top:32px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 26px;border-radius:999px;font-family:inherit;font-weight:800;font-size:17px;text-decoration:none;border:2px solid var(--ink);background:var(--acc);color:var(--ink);cursor:pointer;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 5px 0 var(--ink)}
.btn.ghost{background:transparent}
.btn.dark{background:var(--ink);color:var(--cream)}
.btn svg{width:18px;height:18px}

/* sections */
.sec{padding:56px 0}
.sec h2{margin:0 0 8px;font-size:clamp(30px,5vw,48px);line-height:1.08;letter-spacing:-.035em;font-weight:800;text-wrap:balance}
.sec .lead{margin:0 0 32px;color:var(--muted);max-width:40em;font-size:18px}

/* project cards */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:22px}
.card{position:relative;display:flex;flex-direction:column;background:var(--paper);border:1.5px solid var(--ink);border-radius:var(--r);overflow:hidden;text-decoration:none;transition:transform .18s,box-shadow .18s;min-width:0}
a.card:hover{transform:translate(-3px,-3px);box-shadow:6px 6px 0 var(--ink)}
.card .cv{aspect-ratio:4/3;background:var(--acc);display:flex;align-items:flex-end;justify-content:center;overflow:hidden;border-bottom:1.5px solid var(--ink)}
.card .cv img{width:54%;max-width:230px;border-radius:22px 22px 0 0;border:2px solid var(--ink);border-bottom:0;margin-top:26px;background:#000}
.card .cv.ph{background:repeating-linear-gradient(135deg,#efe8d8 0 14px,#f7f2e8 14px 28px);align-items:center;color:var(--ink)}
.card .cv.ph svg{width:72px;height:72px;opacity:.85}
.card .bd{padding:22px 24px 26px;display:flex;flex-direction:column;gap:8px;flex:1}
.card h3{margin:0;font-size:28px;letter-spacing:-.03em;line-height:1.1;font-weight:800}
.card p{margin:0;color:var(--muted);font-size:16px}
.card .go{margin-top:auto;padding-top:12px;font-weight:800;display:flex;align-items:center;gap:8px}
.badge{display:inline-flex;align-self:flex-start;align-items:center;gap:7px;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:800;letter-spacing:.03em;border:1.5px solid var(--ink)}
.badge i{width:8px;height:8px;border-radius:50%;background:currentColor}
.badge.live{background:#d7f0c8}
.badge.soon{background:#ffe7a3}
.badge.plan{background:#ece7da}

/* about */
.about{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center}
.about .big{font-size:clamp(34px,6vw,64px);line-height:1.02;letter-spacing:-.04em;font-weight:800}
.about .big span{font-weight:300}
.about p{margin:0 0 14px;color:var(--muted);font-size:18px}
.about p b{color:var(--ink)}

/* footer */
.ft{margin-top:56px;background:var(--ink);color:var(--cream);padding:52px 0 40px}
.ft .wrap{display:flex;flex-wrap:wrap;gap:28px;justify-content:space-between;align-items:flex-start}
.ft p{margin:10px 0 0;color:#cfc8b6;max-width:26em;font-size:15px}
.ft .soc{display:flex;gap:10px;flex-wrap:wrap}
.ft .soc a{padding:10px 18px;border:1.5px solid #4a463a;border-radius:999px;text-decoration:none;font-weight:500;font-size:15px}
.ft .soc a:hover{background:var(--acc);color:var(--ink);border-color:var(--acc)}
.ft small{display:block;width:100%;color:#9b9484;font-size:13px}

/* project page */
.crumb{padding:26px 0 0}
.crumb a{text-decoration:none;font-weight:500;color:var(--muted);display:inline-flex;gap:8px;align-items:center}
.crumb a:hover{color:var(--ink)}
.ph-hero{padding:28px 0 20px;display:grid;grid-template-columns:1.05fr 1fr;gap:40px;align-items:center}
.ph-hero h1{margin:14px 0 0;font-size:clamp(34px,6vw,64px);line-height:1;letter-spacing:-.05em;font-weight:800}
.ph-hero .tg{margin:18px 0 0;font-size:clamp(19px,2.6vw,24px);line-height:1.35;font-weight:500}
.ph-hero .sm{margin:16px 0 0;color:var(--muted);max-width:34em}
.ph-hero .row{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.phones{position:relative;height:min(520px,92vw);display:flex;justify-content:center;align-items:flex-end;background:var(--acc);border:1.5px solid var(--ink);border-radius:36px;overflow:hidden;padding:0 16px}
.phones img{position:relative;width:34%;border-radius:22px 22px 0 0;border:2px solid var(--ink);border-bottom:0;background:#000;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.phones img:nth-child(1){transform:translateY(30px) rotate(-4deg);margin-right:-6%}
.phones img:nth-child(2){z-index:2;width:38%;transform:translateY(8px)}
.phones img:nth-child(3){transform:translateY(30px) rotate(4deg);margin-left:-6%}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:18px}
.feat div{background:var(--paper);border:1.5px solid var(--ink);border-radius:var(--r);padding:24px}
.feat b{display:block;font-size:21px;letter-spacing:-.02em;line-height:1.2;margin-bottom:8px}
.feat span{color:var(--muted);font-size:16px}
.feat .n{display:inline-flex;width:36px;height:36px;border-radius:50%;background:var(--acc);border:1.5px solid var(--ink);align-items:center;justify-content:center;font-weight:800;margin-bottom:14px}
.steps{display:flex;flex-direction:column;gap:56px;counter-reset:s}
.step{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
.step:nth-child(even) .tx{order:2}
.step .num{display:inline-flex;width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--cream);align-items:center;justify-content:center;font-weight:800;margin-bottom:14px}
.step h3{margin:0 0 10px;font-size:clamp(26px,4vw,38px);line-height:1.1;letter-spacing:-.035em;font-weight:800;text-wrap:balance}
.step p{margin:0;color:var(--muted);font-size:18px;max-width:28em}
.step .im{justify-self:center;width:100%;max-width:380px;border:1.5px solid var(--ink);border-radius:var(--r);overflow:hidden;background:#0c0c0d;box-shadow:8px 8px 0 var(--ink)}
.gal{display:flex;gap:18px;overflow-x:auto;padding:6px 20px 24px;margin:0 -20px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.gal figure{margin:0;flex:0 0 auto;width:min(230px,62vw);scroll-snap-align:start}
.gal img{width:100%;border-radius:26px;border:1.5px solid var(--ink);background:#000}
.gal figcaption{margin-top:10px;text-align:center;font-weight:500;font-size:15px;color:var(--muted)}
.inst{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px}
.inst div{background:var(--paper);border:1.5px solid var(--ink);border-radius:var(--r);padding:24px}
.inst b{display:block;font-size:14px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px}
.inst span{font-size:19px;line-height:1.4}
.cta{background:var(--ink);color:var(--cream);border-radius:34px;padding:clamp(32px,6vw,64px);text-align:center;margin:20px 0}
.cta h2{margin:0 0 10px;font-size:clamp(32px,6vw,56px);line-height:1.05;letter-spacing:-.04em;font-weight:800}
.cta p{margin:0 auto 26px;color:#cfc8b6;max-width:30em}
.cta .btn{border-color:var(--acc)}
.cta .btn:hover{box-shadow:0 5px 0 var(--acc)}
.mini{display:flex;flex-direction:column;gap:10px}
.mini a,.mini div{display:flex;align-items:center;gap:14px;background:var(--paper);border:1.5px solid var(--ink);border-radius:20px;padding:14px 18px;text-decoration:none}
.mini svg{width:28px;height:28px;flex-shrink:0}
.mini b{font-size:19px}
.mini em{margin-left:auto;font-style:normal;font-size:13px;font-weight:800;color:var(--muted)}
.nf{padding:90px 0;text-align:center}
.nf h1{font-size:clamp(34px,6vw,56px);letter-spacing:-.04em;margin:0 0 12px}

@media (max-width:800px){
  .hero{padding:44px 0 28px}
  .sec{padding:40px 0}
  .about,.ph-hero,.step{grid-template-columns:1fr;gap:26px}
  .step:nth-child(even) .tx{order:0}
  .nav a:not(.pill){display:none}
  .step .im{max-width:320px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

.plogo{width:52px;height:52px;border-radius:13px;flex:none;display:block}
.hrow{display:flex;align-items:center;gap:14px}
.ph-hero .plogo{width:84px;height:84px;border-radius:21px;margin-bottom:16px;box-shadow:0 6px 0 var(--ink);border:1.5px solid var(--ink)}
.mini .plogo{width:34px;height:34px;border-radius:9px}

html{background:#f7f2e8}
body{background:#f7f2e8;color:#17150f}
.brand{font-weight:800;letter-spacing:-.06em}
.brand b,.brand span{font-weight:800}

  var LOGO='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+PGcgZmlsbD0iIzE3MTUwZiI+PHJlY3QgeD0iOCIgeT0iOCIgd2lkdGg9IjE0IiBoZWlnaHQ9IjE0IiByeD0iMyIvPjxyZWN0IHg9IjQ0IiB5PSI4IiB3aWR0aD0iMTQiIGhlaWdodD0iMTQiIHJ4PSIzIi8+PHJlY3QgeD0iOCIgeT0iMjYiIHdpZHRoPSIxNCIgaGVpZ2h0PSIxNCIgcng9IjMiLz48cmVjdCB4PSI4IiB5PSI0NCIgd2lkdGg9IjE0IiBoZWlnaHQ9IjE0IiByeD0iMyIvPjxyZWN0IHg9IjQ0IiB5PSI0NCIgd2lkdGg9IjE0IiBoZWlnaHQ9IjE0IiByeD0iMyIvPjwvZz48cmVjdCB4PSIyNiIgeT0iMjYiIHdpZHRoPSIxNCIgaGVpZ2h0PSIxNCIgcng9IjMiIGZpbGw9IiNmNGI2MmEiLz48L3N2Zz4=',LOGOL='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+PGcgZmlsbD0iI2Y3ZjJlOCI+PHJlY3QgeD0iOCIgeT0iOCIgd2lkdGg9IjE0IiBoZWlnaHQ9IjE0IiByeD0iMyIvPjxyZWN0IHg9IjQ0IiB5PSI4IiB3aWR0aD0iMTQiIGhlaWdodD0iMTQiIHJ4PSIzIi8+PHJlY3QgeD0iOCIgeT0iMjYiIHdpZHRoPSIxNCIgaGVpZ2h0PSIxNCIgcng9IjMiLz48cmVjdCB4PSI4IiB5PSI0NCIgd2lkdGg9IjE0IiBoZWlnaHQ9IjE0IiByeD0iMyIvPjxyZWN0IHg9IjQ0IiB5PSI0NCIgd2lkdGg9IjE0IiBoZWlnaHQ9IjE0IiByeD0iMyIvPjwvZz48cmVjdCB4PSIyNiIgeT0iMjYiIHdpZHRoPSIxNCIgaGVpZ2h0PSIxNCIgcng9IjMiIGZpbGw9IiNmNGI2MmEiLz48L3N2Zz4=';
  var S = window.SITE, P = window.PROJECTS;
  var $ = function (s) { return document.querySelector(s); };
  function esc(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function safeUrl(u) { return /^(https?:\/\/|\/)/.test(u || '') ? u : '#'; }

  var ICONS = {
    wallet: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h12v4"/><path d="M3 7v11a2 2 0 0 0 2 2h14a1 1 0 0 0 1-1v-9a1 1 0 0 0-1-1H5a2 2 0 0 1-2-2z"/><circle cx="16.5" cy="14.5" r="1.2" fill="currentColor"/></svg>',
    mail: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
    bike: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="M6 17l4-8h5l3 8M10 9 8 6H6M14 9l-2 8"/></svg>',
    spark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M18 6l-2.5 2.5M8.5 15.5 6 18"/></svg>'
  };
  var ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  var BACK = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>';
  var STATUS = { live: 'Sudah jalan', soon: 'Segera', plan: 'Dalam rencana' };

  function plogo(p) { return p.logo ? '<img class="plogo" src="' + esc(p.logo) + '" alt="">' : ''; }
  function icon(k) { return ICONS[k] || ICONS.spark; }
  function badge(s) { var k = STATUS[s] ? s : 'plan'; return '<span class="badge ' + k + '"><i></i>' + STATUS[k] + '</span>'; }

  function header() {
    return '<header class="hd"><div class="wrap"><a class="brand" href="#home" aria-label="kajibikin beranda"><img src="' + LOGO + '" alt=""><span><b>kaji</b><span>bikin</span></span></a>' +
      '<nav class="nav"><a href="#project">Project</a><a href="#tentang">Tentang</a><a class="pill" href="' + esc(safeUrl(S.social.instagram)) + '" target="_blank" rel="noopener">Instagram</a></nav></div></header>';
  }
  function footer() {
    var s = S.social;
    return '<footer class="ft"><div class="wrap"><div><a class="brand" href="#home"><img src="' + LOGOL + '" alt=""><span><b>kaji</b><span>bikin</span></span></a>' +
      '<p>Bikin aplikasi buat masalah sehari-hari. Satu project, satu masalah.</p></div>' +
      '<div class="soc"><a href="' + esc(safeUrl(s.instagram)) + '" target="_blank" rel="noopener">Instagram</a><a href="' + esc(safeUrl(s.threads)) + '" target="_blank" rel="noopener">Threads</a><a href="' + esc(safeUrl(s.x)) + '" target="_blank" rel="noopener">X</a></div>' +
      '<small>© ' + new Date().getFullYear() + ' kajibikin</small></div></footer>';
  }

  function card(p) {
    var live = p.status === 'live';
    var cv = (live && p.cover)
      ? '<div class="cv"><img src="' + esc(p.cover) + '" alt="Tampilan ' + esc(p.name) + '" loading="lazy"></div>'
      : '<div class="cv ph">' + icon(p.icon) + '</div>';
    var body = '<div class="bd">' + badge(p.status) + '<div class="hrow">' + plogo(p) + '<h3>' + esc(p.name) + '</h3></div><p>' + esc(p.tagline) + '</p>' +
      (live ? '<span class="go">Lihat caranya ' + ARROW.replace('<svg', '<svg width="18" height="18"') + '</span>' : '') + '</div>';
    return live
      ? '<a class="card" href="#' + encodeURIComponent(p.slug) + '">' + cv + body + '</a>'
      : '<div class="card">' + cv + body + '</div>';
  }

  function home() {
    var first = P.filter(function (p) { return p.status === 'live'; })[0];
    document.title = 'kajibikin | Bikin aplikasi buat masalah sehari-hari';
    $('#app').innerHTML = header() +
      '<main><section class="hero"><div class="wrap"><span class="eyebrow">KUMPULAN PROJECT</span>' +
      '<h1>Bikin aplikasi buat <em>masalah sehari-hari.</em></h1>' +
      '<p>Gue kaji masalah yang sering bikin ribet, terus gue bikin solusinya. Semuanya gratis dicoba, tinggal buka di HP.</p>' +
      '<div class="row"><a class="btn" href="#project">Lihat project</a>' +
      (first ? '<a class="btn ghost" href="#' + encodeURIComponent(first.slug) + '">Coba ' + esc(first.name) + '</a>' : '') + '</div></div></section>' +
      '<section class="sec" id="project"><div class="wrap"><h2>Project</h2><p class="lead">Satu per satu, dari yang sudah jalan sampai yang masih di kepala.</p><div class="grid">' + P.map(card).join('') + '</div></div></section>' +
      '<section class="sec" id="tentang"><div class="wrap about"><div class="big">kaji <span>+</span> bikin</div>' +
      '<div><p><b>Kaji</b> artinya dipelajari dulu masalahnya: apa yang bikin orang males, bingung, atau ribet.</p>' +
      '<p><b>Bikin</b> artinya langsung dibuat solusinya, sederhana dan bisa dipakai hari ini juga.</p>' +
      '<p>Project baru akan terus ditambah di sini.</p></div></div></section></main>' + footer();
  }

  function slugNow() { return decodeURIComponent(location.hash.slice(1)); }

  function notFound() {
    document.title = 'Tidak ketemu | kajibikin';
    $('#app').innerHTML = header() + '<main class="nf wrap"><h1>Halaman ini nggak ada</h1><p>Mungkin link-nya salah, atau project-nya belum dibuat.</p><p><a class="btn" href="#home">Ke beranda</a></p></main>' + footer();
  }

  function project() {
    var slug = slugNow();
    var p = P.filter(function (x) { return x.slug === slug; })[0];
    if (!p || p.status !== 'live') return notFound();
    document.title = p.name + ' | kajibikin';
    var meta = document.querySelector('meta[name="description"]');
    if (meta) meta.setAttribute('content', p.summary || p.tagline);

    var hero = (p.hero || []).map(function (i) { return '<img src="' + esc(i) + '" alt="">'; }).join('');
    var feat = (p.features || []).map(function (f, i) { return '<div><span class="n">' + (i + 1) + '</span><b>' + esc(f.title) + '</b><span>' + esc(f.text) + '</span></div>'; }).join('');
    var steps = (p.steps || []).map(function (s, i) {
      return '<div class="step"><div class="tx"><span class="num">' + (i + 1) + '</span><h3>' + esc(s.title) + '</h3><p>' + esc(s.text) + '</p></div>' +
        (s.img ? '<div class="im"><img src="' + esc(s.img) + '" alt="Langkah ' + (i + 1) + ': ' + esc(s.title) + '" loading="lazy"></div>' : '') + '</div>';
    }).join('');
    var gal = (p.gallery || []).map(function (g) { return '<figure><img src="' + esc(g.img) + '" alt="' + esc(g.caption) + '" loading="lazy"><figcaption>' + esc(g.caption) + '</figcaption></figure>'; }).join('');
    var inst = (p.install || []).map(function (i) { return '<div><b>' + esc(i.platform) + '</b><span>' + esc(i.text) + '</span></div>'; }).join('');
    var others = P.filter(function (x) { return x.slug !== p.slug; }).map(function (x) {
      var inner = (x.logo ? plogo(x) : icon(x.icon)) + '<b>' + esc(x.name) + '</b><em>' + esc(STATUS[x.status] || '') + '</em>';
      return x.status === 'live' ? '<a href="#' + encodeURIComponent(x.slug) + '">' + inner + '</a>' : '<div>' + inner + '</div>';
    }).join('');
    var url = esc(safeUrl(p.url));

    $('#app').innerHTML = header() + '<main><div class="wrap">' +
      '<div class="crumb"><a href="#home">' + BACK + ' Semua project</a></div>' +
      '<section class="ph-hero"><div>' + plogo(p) + badge(p.status) + '<h1>' + esc(p.name) + '</h1><p class="tg">' + esc(p.tagline) + '</p><p class="sm">' + esc(p.summary || '') + '</p>' +
      '<div class="row"><a class="btn" href="' + url + '" target="_blank" rel="noopener">' + esc(p.cta || 'Buka') + ' ' + ARROW + '</a><a class="btn ghost" href="#cara">Lihat caranya</a></div></div>' +
      '<div class="phones">' + hero + '</div></section>' +
      (feat ? '<section class="sec"><div class="feat">' + feat + '</div></section>' : '') +
      (steps ? '<section class="sec" id="cara"><h2>' + esc(p.stepsTitle || 'Cara pakai') + '</h2><p class="lead">Ikuti urutannya, nggak sampai lima menit.</p><div class="steps">' + steps + '</div></section>' : '') +
      (gal ? '<section class="sec"><h2>' + esc(p.galleryTitle || 'Tampilan') + '</h2><p class="lead">Geser ke samping untuk lihat semua.</p><div class="gal">' + gal + '</div></section>' : '') +
      (inst ? '<section class="sec"><h2>Pasang di HP</h2><p class="lead">Nggak perlu toko aplikasi.</p><div class="inst">' + inst + '</div></section>' : '') +
      '<section class="cta"><h2>Udah siap ngatur?</h2><p>Gratis dicoba, langsung dari browser.</p><a class="btn" href="' + url + '" target="_blank" rel="noopener">' + esc(p.cta || 'Buka') + ' ' + ARROW + '</a></section>' +
      (others ? '<section class="sec"><h2>Project lainnya</h2><div class="mini" style="margin-top:20px">' + others + '</div></section>' : '') +
      '</div></main>' + footer();
    window.scrollTo(0, 0);
  }

  
  function goto(id){var e=document.getElementById(id);if(e)e.scrollIntoView({behavior:'smooth',block:'start'});}
  function route(){
    var h=slugNow();
    if(h==='cara'){goto('cara');return;}
    if(h==='project'||h==='tentang'){ if(!document.getElementById(h)){home();} goto(h);return; }
    if(h===''||h==='home'){home();window.scrollTo(0,0);return;}
    project();
  }
  window.addEventListener('hashchange',route); route();
})();

</script>

</body></html>
